<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExCourt - 消息中心</title>
  <link rel="stylesheet" href="/frontend/assets/css/styles.css">
  <style>
    /* 消息页面特有样式 */
    .msg-tabs { display: flex; background: white; padding: 10px; border-bottom: 1px solid #eee; }
    .msg-tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; color: #666; border-radius: 8px; }
    .msg-tab.active { background: #e8f2fb; color: #4a90e2; font-weight: bold; }
    
    .list-item { background: white; padding: 16px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .list-item:hover { background: #f9f9f9; }
    .avatar { width: 48px; height: 48px; background: #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .item-content { flex: 1; }
    .item-title { font-weight: 600; margin-bottom: 4px; }
    .item-subtitle { font-size: 13px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-time { font-size: 12px; color: #aaa; }
    
    /* 聊天窗口覆盖层 */
    .chat-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s; }
    .chat-overlay.open { transform: translateX(0); }
    .chat-header { padding: 16px; background: #f8f9fb; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; background: #fff; display: flex; flex-direction: column; gap: 12px; }
    .chat-footer { padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; }
    .chat-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    
    .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
    .msg-sent { align-self: flex-end; background: #4a90e2; color: white; border-bottom-right-radius: 4px; }
    .msg-received { align-self: flex-start; background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
    
    .badge { background: red; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="msg-tabs">
      <div class="msg-tab active" onclick="switchTab('chats')">消息</div>
      <div class="msg-tab" onclick="switchTab('friends')">好友</div>
      <div class="msg-tab" onclick="switchTab('requests')">申请 <span id="reqBadge" class="badge" style="display:none">0</span></div>
    </div>

    <div class="main-content" style="padding: 0;">
      <!-- 会话列表 -->
      <div id="panel-chats">
        <div class="loading">加载中...</div>
      </div>

      <!-- 好友列表 -->
      <div id="panel-friends" style="display: none;">
        <div style="padding: 12px;">
            <input type="text" id="addFriendInput" placeholder="输入用户名搜索" style="width: 70%; padding: 8px;">
            <button onclick="searchUser()" style="width: 25%; padding: 8px;">搜索</button>
        </div>
        <div id="searchResult"></div>
        <div id="friendsList"></div>
      </div>

      <!-- 申请列表 -->
      <div id="panel-requests" style="display: none;">
        <div id="requestsList"></div>
      </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <a href="/frontend/pages/dashboard.html" class="nav-item">
        <div class="nav-icon">🏠</div><span>主页</span>
      </a>
      <a href="/frontend/pages/post.html" class="nav-item">
        <div class="nav-icon">➕</div><span>发布场地</span>
      </a>
      <a href="/frontend/pages/search.html" class="nav-item">
        <div class="nav-icon">🔍</div><span>搜索场地</span>
      </a>
      <a href="/frontend/pages/messages.html" class="nav-item active">
        <div class="nav-icon">💬</div><span>消息</span>
      </a>
      <a href="/frontend/pages/profile.html" class="nav-item">
        <div class="nav-icon">👤</div><span>个人中心</span>
      </a>
    </nav>
  </div>

  <!-- 聊天窗口 -->
  <div id="chatWindow" class="chat-overlay">
    <div class="chat-header">
      <button onclick="closeChat()" style="border:none; background:none; font-size:20px;color:#4a90e2">⬅️</button>
      <span id="chatTitle" style="font-weight:bold; font-size:16px;">用户名</span>
    </div>
    <div id="chatBody" class="chat-body"></div>
    <div class="chat-footer">
      <input type="text" id="chatInput" class="chat-input" placeholder="发送消息...">
      <button onclick="sendMessage()" style="border:none; background:#4a90e2; color:rgb(254, 254, 254); padding:0 16px; border-radius:20px;">发送</button>
      <button onclick="togglePlusMenu()" style="border:none; background:#27ae60; color:white; padding:0 12px; border-radius:20px; font-size:18px;">+</button>
    </div>
    <!-- 加号菜单 -->
    <div id="plusMenu" style="display:none; padding:12px; background:#f8f9fb; border-top:1px solid #eee;">
      <div style="display:flex; gap:12px; justify-content:center;">
        <button onclick="showGiftCourt()" style="padding:12px 20px; border:none; background:#4a90e2; color:white; border-radius:8px;">🏟️ 赠予场地</button>
        <button onclick="showTransferPoints()" style="padding:12px 20px; border:none; background:#f39c12; color:white; border-radius:8px;">💰 积分转账</button>
      </div>
    </div>
    <!-- 场地选择面板 -->
    <div id="courtSelectPanel" style="display:none; padding:12px; background:#fff; border-top:1px solid #eee; max-height:200px; overflow-y:auto;">
      <div style="margin-bottom:8px; font-weight:bold;">选择要赠送的场地：</div>
      <div id="myCourtsList"></div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button onclick="confirmGiftCourts()" style="flex:1; padding:8px; border:none; background:#27ae60; color:white; border-radius:4px;">确认赠送</button>
        <button onclick="cancelGiftCourt()" style="flex:1; padding:8px; border:none; background:#ccc; color:#333; border-radius:4px;">取消</button>
      </div>
    </div>
    <!-- 积分转账面板 -->
    <div id="pointsTransferPanel" style="display:none; padding:12px; background:#fff; border-top:1px solid #eee;">
      <div style="margin-bottom:8px; font-weight:bold;">转账积分：</div>
      <input type="number" id="transferPointsInput" placeholder="输入积分数量" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; margin-bottom:8px;">
      <div style="display:flex; gap:8px;">
        <button onclick="confirmTransferPoints()" style="flex:1; padding:8px; border:none; background:#f39c12; color:white; border-radius:4px;">确认转账</button>
        <button onclick="cancelTransferPoints()" style="flex:1; padding:8px; border:none; background:#ccc; color:#333; border-radius:4px;">取消</button>
      </div>
    </div>
  </div>

  <script type="module" src="/frontend/assets/js/messages.js"></script>
</body>
</html>
