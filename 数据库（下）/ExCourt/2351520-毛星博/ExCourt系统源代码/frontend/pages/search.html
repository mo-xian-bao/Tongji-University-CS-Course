<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ExCourt - 搜索场地</title>
    <link rel="stylesheet" href="/frontend/assets/css/styles.css">
</head>

<body>
    <div class="app-container">
        <div class="main-content">
            <div class="form-container">
                <div class="form-title">搜索场地</div>

                <div class="tabs">
                    <div class="tab active" onclick="switchTab('owned')">已有场地</div>
                    <div class="tab" onclick="switchTab('wanted')">需求场地</div>
                </div>

                <!-- 搜索已有场地 -->
                <div id="ownedPanel" class="panel">
                    <div class="form-group">
                        <label>场地ID（可选）</label>
                        <input type="text" id="ownedCourtId" placeholder="留空则搜索所有场地">
                    </div>

                    <div class="form-group">
                        <label>日期（可选）</label>
                        <input type="date" id="ownedDate">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>开始时间（可选）</label>
                            <select id="ownedStartHour">
                                <option value="">不限</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>结束时间（可选）</label>
                            <select id="ownedEndHour">
                                <option value="">不限</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="searchOwnedCourts()">搜索</button>

                    <div class="search-results">
                        <div class="result-count" id="ownedResultCount" style="display: none;"></div>
                        <div class="court-list" id="ownedResults"></div>
                    </div>
                </div>

                <!-- 搜索需求场地 -->
                <div id="wantedPanel" class="panel hidden">
                    <div class="form-group">
                        <label>场地ID（可选）</label>
                        <input type="text" id="wantedCourtId" placeholder="留空则搜索所有场地">
                    </div>

                    <div class="form-group">
                        <label>日期（可选）</label>
                        <input type="date" id="wantedDate">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>开始时间（可选）</label>
                            <select id="wantedStartHour">
                                <option value="">不限</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>结束时间（可选）</label>
                            <select id="wantedEndHour">
                                <option value="">不限</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="searchWantedCourts()">搜索</button>

                    <div class="search-results">
                        <div class="result-count" id="wantedResultCount" style="display: none;"></div>
                        <div class="court-list" id="wantedResults"></div>
                    </div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="/frontend/pages/dashboard.html" class="nav-item">
                <div class="nav-icon">🏠</div>
                <span>主页</span>
            </a>
            <a href="/frontend/pages/post.html" class="nav-item">
                <div class="nav-icon">➕</div>
                <span>发布场地</span>
            </a>
            <a href="/frontend/pages/search.html" class="nav-item active">
                <div class="nav-icon">🔍</div>
                <span>搜索场地</span>
            </a>
            <a href="/frontend/pages/messages.html" class="nav-item">
                <div class="nav-icon">💬</div>
                <span>消息</span>
            </a>
            <a href="/frontend/pages/profile.html" class="nav-item">
                <div class="nav-icon">👤</div>
                <span>个人中心</span>
            </a>
        </nav>
    </div>

    <!-- 积分交换模态框 -->
    <div id="exchangeModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">积分交换</div>
            </div>
            <div class="modal-body">
                <div class="modal-input-group">
                    <label class="modal-input-label">请输入您愿意支付的积分</label>
                    <input type="number" id="exchangePointsInput" class="modal-input" placeholder="例如：10" min="1">
                    <div class="modal-hint">积分必须大于 0</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="secondary" onclick="closeExchangeModal()">取消</button>
                <button onclick="confirmExchange()">确认交换</button>
            </div>
        </div>
    </div>

    <!-- 场地选择模态框 -->
    <div id="courtSelectionModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">选择您的场地进行交换</div>
            </div>
            <div class="modal-body">
                <div id="myCourtOptions" class="court-options-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="secondary" onclick="closeCourtSelectionModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 生成整点时间选项
        function populateHourSelects() {
            const selects = ['ownedStartHour', 'ownedEndHour', 'wantedStartHour', 'wantedEndHour'];
            selects.forEach(id => {
                const select = document.getElementById(id);
                // 保留第一个"不限"选项
                for (let h = 6; h <= 24; h++) {
                    const option = document.createElement('option');
                    option.value = h;
                    option.textContent = h === 24 ? '24:00' : `${h}:00`;
                    select.appendChild(option);
                }
            });
        }
        populateHourSelects();

        function showMessages(event) {
            event.preventDefault();
            alert('消息功能正在开发中...');
        }
    </script>
    <script type="module">
        import { requireAuthOrRedirect, getAuth } from "/frontend/assets/js/auth.js";
        import { API_BASE, postJSON } from "/frontend/assets/js/api.js";
        import { showAlert, showSuccess, showError, showConfirm } from "/frontend/assets/js/dialog.js";

        const username = requireAuthOrRedirect();
        const token = getAuth()?.token;

        // 定义全局变量
        let directExchangeTarget = null;

        window.switchTab = function (type) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => tab.classList.remove('active'));

            if (type === 'owned') {
                tabs[0].classList.add('active');
                document.getElementById('ownedPanel').classList.remove('hidden');
                document.getElementById('wantedPanel').classList.add('hidden');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('ownedPanel').classList.add('hidden');
                document.getElementById('wantedPanel').classList.remove('hidden');
            }
        };

        window.searchOwnedCourts = async function () {
            const courtId = document.getElementById('ownedCourtId').value.trim();
            const date = document.getElementById('ownedDate').value;
            const startHour = document.getElementById('ownedStartHour').value;
            const endHour = document.getElementById('ownedEndHour').value;

            const resultsContainer = document.getElementById('ownedResults');
            const countContainer = document.getElementById('ownedResultCount');

            resultsContainer.innerHTML = '<div class="loading">搜索中...</div>';
            countContainer.style.display = 'none';

            const searchParams = {};
            if (courtId) searchParams.court_id = parseInt(courtId);
            if (date) searchParams.start_date = date;
            if (startHour) searchParams.start_hour = parseInt(startHour);
            if (endHour) searchParams.end_hour = parseInt(endHour);

            try {
                // 使用 postJSON 替代 fetch，并传入 token
                const data = await postJSON('/courts/owned/search', searchParams, token);

                if (data.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🔍</div>
                            <div class="empty-text">未找到匹配的场地</div>
                        </div>
                    `;
                    return;
                }

                countContainer.textContent = `找到 ${data.length} 个结果`;
                countContainer.style.display = 'block';

                resultsContainer.innerHTML = data.map(court => {
                    // 安全转义，防止用户名包含单引号导致报错
                    const safeUser = court.owned_user_name.replace(/'/g, "\\'");
                    
                    return `
                    <div class="court-list-item">
                        <div class="court-list-info">
                            <div class="court-list-id">场地 ${court.court_id}</div>
                            <div class="court-list-details">
                                <div class="court-list-detail">
                                    <span class="detail-label">发布者</span>
                                    <span class="detail-value">${court.owned_user_name}</span>
                                </div>
                                <div class="court-list-detail">
                                    <span class="detail-label">日期</span>
                                    <span class="detail-value">${court.start_date}</span>
                                </div>
                                <div class="court-list-detail">
                                    <span class="detail-label">时间</span>
                                    <span class="detail-value">${court.start_hour}:00 - ${court.end_hour}:00</span>
                                </div>
                            </div>
                        </div>
                        ${court.owned_user_name !== username ? `
                            <div class="court-list-action" style="display:flex; gap:8px; flex-wrap:wrap;">
                                <button onclick="window.requestExchange('${safeUser}', ${court.court_id}, '${court.start_date}', ${court.start_hour}, ${court.end_hour})">积分交换</button>
                                <button onclick="window.directExchange('${safeUser}', ${court.court_id}, '${court.start_date}', ${court.start_hour})" style="background:#9b59b6;">场地交换</button>
                            </div>
                        ` : ''}
                    </div>
                `}).join('');
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-text">搜索失败: ${error.message}</div>
                    </div>
                `;
            }
        };

        window.searchWantedCourts = async function () {
            const courtId = document.getElementById('wantedCourtId').value.trim();
            const date = document.getElementById('wantedDate').value;
            const startHour = document.getElementById('wantedStartHour').value;
            const endHour = document.getElementById('wantedEndHour').value;

            const resultsContainer = document.getElementById('wantedResults');
            const countContainer = document.getElementById('wantedResultCount');

            resultsContainer.innerHTML = '<div class="loading">搜索中...</div>';
            countContainer.style.display = 'none';

            const searchParams = {};
            if (courtId) searchParams.court_id = parseInt(courtId);
            if (date) searchParams.start_date = date;
            if (startHour) searchParams.start_hour = parseInt(startHour);
            if (endHour) searchParams.end_hour = parseInt(endHour);

            try {
                // 使用 postJSON 替代 fetch，并传入 token
                const data = await postJSON('/courts/wanted/search', searchParams, token);

                if (data.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🔍</div>
                            <div class="empty-text">未找到匹配的需求</div>
                        </div>
                    `;
                    return;
                }

                countContainer.textContent = `找到 ${data.length} 个结果`;
                countContainer.style.display = 'block';

                resultsContainer.innerHTML = data.map(court => {
                    const safeUser = court.wanted_user_name.replace(/'/g, "\\'");
                    return `
                    <div class="court-list-item">
                        <div class="court-list-info">
                            <div class="court-list-id">场地 ${court.court_id}</div>
                            <div class="court-list-details">
                                <div class="court-list-detail">
                                    <span class="detail-label">需求者</span>
                                    <span class="detail-value">${court.wanted_user_name}</span>
                                </div>
                                <div class="court-list-detail">
                                    <span class="detail-label">日期</span>
                                    <span class="detail-value">${court.start_date}</span>
                                </div>
                                <div class="court-list-detail">
                                    <span class="detail-label">时间</span>
                                    <span class="detail-value">${court.start_hour}:00 - ${court.end_hour}:00</span>
                                </div>
                            </div>
                        </div>
                        ${court.wanted_user_name !== username ? `
                            <div class="court-list-action">
                                <button onclick="window.fulfillWant('${safeUser}', ${court.court_id}, '${court.start_date}', ${court.start_hour})" style="background:#27ae60;">满足需求</button>
                            </div>
                        ` : ''}
                    </div>
                `}).join('');
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-text">搜索失败: ${error.message}</div>
                    </div>
                `;
            }
        };

        // 申请交换
        let currentExchangeParams = null;

        window.requestExchange = function(postUserName, courtId, date, startHour, endHour) {
            currentExchangeParams = { postUserName, courtId, date, startHour, endHour };
            document.getElementById('exchangePointsInput').value = '';
            document.getElementById('exchangeModal').classList.add('open');
            document.getElementById('exchangePointsInput').focus();
        };

        window.closeExchangeModal = function() {
            document.getElementById('exchangeModal').classList.remove('open');
            currentExchangeParams = null;
        };

        window.confirmExchange = async function() {
            const pointsStr = document.getElementById('exchangePointsInput').value;
            const points = parseInt(pointsStr);
            
            if (isNaN(points) || points <= 0) {
                await showError("请输入有效的积分（必须大于0）");
                return;
            }
            
            if (!currentExchangeParams) return;
            
            const { postUserName, courtId, date, startHour, endHour } = currentExchangeParams;
            
            try {
                const response = await fetch(`${API_BASE}/exchange/request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        post_user_name: postUserName,
                        court_id: courtId,
                        date: date,
                        start_hour: startHour,
                        end_hour: endHour,
                        points: points
                    })
                });
                const result = await response.json();
                if (response.ok) {
                    await showSuccess(result.message || '申请成功！');
                    closeExchangeModal();
                } else {
                    await showError(typeof result.detail === 'string' ? result.detail : JSON.stringify(result.detail));
                }
            } catch (e) {
                await showError('请求失败：' + e.message);
            }
        };

        // 直接交换（用我的场地换对方的场地）
        // 注意：这里重新定义 directExchange，确保它在全局作用域可用
        window.directExchange = async function(targetUser, theirCourtId, theirDate, theirStartHour) {
            directExchangeTarget = { targetUser, theirCourtId, theirDate, theirStartHour };
            
            const modal = document.getElementById('courtSelectionModal');
            const listContainer = document.getElementById('myCourtOptions');
            
            if (!modal) {
                await showError("错误：找不到模态框元素，请刷新页面重试。");
                return;
            }

            modal.classList.add('open');
            listContainer.innerHTML = '<div class="loading">正在寻找匹配场地...</div>';
            
            try {
                const encodedUser = encodeURIComponent(targetUser);
                const response = await fetch(`${API_BASE}/exchange/my-options?target_user=${encodedUser}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error("获取场地列表失败");
                
                const options = await response.json();
                
                if (options.length === 0) {
                    listContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-text">您没有可用的场地</div>
                            <div class="empty-hint">请先发布场地</div>
                        </div>
                    `;
                    return;
                }
                
                listContainer.innerHTML = options.map(opt => `
                    <div class="court-option-item ${opt.is_match ? 'match-highlight' : ''}" 
                         onclick="window.confirmDirectExchange(${opt.court_id}, '${opt.date}', ${opt.start_hour})">
                        <div class="court-option-info">
                            <div class="court-id">场地 ${opt.court_id}</div>
                            <div class="court-time">
                                <span>${opt.date}</span>
                                <span>${opt.start_hour}:00 - ${opt.end_hour}:00</span>
                            </div>
                        </div>
                        ${opt.is_match ? '<div class="match-badge">✨ 完美匹配</div>' : ''}
                    </div>
                `).join('');
                
            } catch (error) {
                listContainer.innerHTML = `<div class="error-message">${error.message}</div>`;
            }
        };

        window.closeCourtSelectionModal = function() {
            const modal = document.getElementById('courtSelectionModal');
            if (modal) modal.classList.remove('open');
            directExchangeTarget = null;
        };

        window.confirmDirectExchange = async function(myCourtId, myDate, myStartHour) {
            const confirmed = await showConfirm(
                `确定使用 场地${myCourtId} (${myDate} ${myStartHour}:00) 进行交换吗？`,
                { title: '确认交换', confirmText: '确定交换', type: 'info' }
            );
            if (!confirmed) return;
            
            try {
                const response = await fetch(`${API_BASE}/exchange/direct`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        target_user: directExchangeTarget.targetUser,
                        my_court_id: myCourtId,
                        my_date: myDate,
                        my_start_hour: myStartHour,
                        their_court_id: directExchangeTarget.theirCourtId,
                        their_date: directExchangeTarget.theirDate,
                        their_start_hour: directExchangeTarget.theirStartHour
                    })
                });
                
                const result = await response.json();
                if (response.ok) {
                    await showSuccess(result.message || '交换成功！');
                    closeCourtSelectionModal();
                    if (typeof searchOwnedCourts === 'function') searchOwnedCourts();
                } else {
                    await showError(typeof result.detail === 'string' ? result.detail : JSON.stringify(result.detail));
                }
            } catch (e) {
                await showError('请求失败：' + e.message);
            }
        };

        // 满足需求（把我的场地转让给对方）
        window.fulfillWant = async function(targetUser, courtId, date, startHour) {
            const confirmed = await showConfirm(
                `确认将您的场地 ${courtId} 转让给 ${targetUser} 吗？`,
                { title: '确认转让', confirmText: '确定转让', type: 'info' }
            );
            if (!confirmed) return;
            
            try {
                const response = await fetch(`${API_BASE}/exchange/fulfill`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        target_user: targetUser,
                        court_id: courtId,
                        date: date,
                        start_hour: startHour
                    })
                });
                const result = await response.json();
                if (response.ok) {
                    await showSuccess(result.message || '转让成功！');
                    searchWantedCourts();
                } else {
                    await showError(typeof result.detail === 'string' ? result.detail : JSON.stringify(result.detail));
                }
            } catch (e) {
                await showError('请求失败：' + e.message);
            }
        };

        // 检查 URL 参数，自动填充并搜索
        function checkAutoSearch() {
            const params = new URLSearchParams(window.location.search);
            const courtId = params.get('court_id');
            const date = params.get('date');
            const startHour = params.get('start_hour');
            const endHour = params.get('end_hour');
            const autoSearch = params.get('auto_search');
            
            if (courtId) document.getElementById('ownedCourtId').value = courtId;
            if (date) document.getElementById('ownedDate').value = date;
            if (startHour) document.getElementById('ownedStartHour').value = startHour;
            if (endHour) document.getElementById('ownedEndHour').value = endHour;
            
            // 如果有 auto_search 参数，自动执行搜索
            if (autoSearch === '1' && (courtId || date)) {
                setTimeout(() => {
                    searchOwnedCourts();
                }, 100);
            }
        }
        
        // 页面加载时检查
        checkAutoSearch();
    </script>
</body>

</html>
