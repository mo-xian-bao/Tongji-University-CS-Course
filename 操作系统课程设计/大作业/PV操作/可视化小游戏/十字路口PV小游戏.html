<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>十字路口 PV 操作可视化小游戏</title>
  <style>
    :root {
      --bg: #eef3f8;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #647084;
      --line: #d8e0ea;
      --road: #3d4553;
      --road-line: rgba(255,255,255,.7);
      --green: #15985f;
      --blue: #2563eb;
      --amber: #d98900;
      --red: #d33838;
      --purple: #7c3aed;
      --shadow: 0 16px 34px rgba(20, 34, 58, .12);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(33, 75, 120, .06) 1px, transparent 1px),
        linear-gradient(rgba(33, 75, 120, .06) 1px, transparent 1px),
        var(--bg);
      background-size: 26px 26px;
      color: var(--ink);
    }

    .app {
      width: min(1440px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 18px 0 22px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .top-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(88px, 1fr));
      gap: 8px;
      min-width: min(470px, 100%);
    }

    .stat {
      background: rgba(255,255,255,.86);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 4px 12px rgba(20, 34, 58, .06);
    }

    .stat .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .stat .value {
      font-weight: 800;
      font-size: 19px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(520px, 1fr) 330px;
      gap: 14px;
      align-items: stretch;
    }

    .panel {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      font-weight: 800;
      background: #f8fafc;
    }

    .panel-body {
      padding: 12px 14px 14px;
    }

    .mode-list {
      display: grid;
      gap: 9px;
    }

    .mode-btn {
      width: 100%;
      min-height: 82px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      text-align: left;
      color: var(--ink);
      cursor: pointer;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    .mode-btn:hover {
      border-color: #9ab1cf;
      transform: translateY(-1px);
    }

    .mode-btn.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
    }

    .mode-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      min-width: 54px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .pill.green { background: #dcf7ea; color: #0b7a48; }
    .pill.blue { background: #dfeaff; color: #1f55cf; }
    .pill.amber { background: #fff1d6; color: #995f00; }
    .pill.red { background: #ffe0e0; color: #b62020; }
    .pill.gray { background: #edf1f6; color: #506076; }

    .mode-text {
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button,
    input[type="range"] {
      font: inherit;
    }

    .cmd {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .cmd:hover {
      background: #f3f6fb;
      border-color: #9ab1cf;
    }

    .cmd.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .cmd.danger {
      background: #fff;
      border-color: #f0b8b8;
      color: #b62020;
    }

    .dir-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .dir {
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .dir:hover {
      border-color: #9ab1cf;
      background: #f7faff;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 76px 1fr 42px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    .stage-panel {
      min-height: 720px;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .stage-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }

    .headline {
      font-weight: 900;
      font-size: 18px;
      min-width: 0;
    }

    .algorithm-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status-badge {
      min-width: 128px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
      background: var(--green);
      white-space: nowrap;
    }

    .status-badge.warn {
      background: var(--amber);
    }

    .status-badge.dead {
      background: var(--red);
    }

    .stage {
      position: relative;
      min-height: 662px;
      overflow: hidden;
      background: linear-gradient(180deg, #dfe9f4 0%, #edf4fb 100%);
    }

    .grass {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12% 14%, rgba(21,152,95,.16), transparent 18%),
        radial-gradient(circle at 83% 17%, rgba(37,99,235,.12), transparent 20%),
        radial-gradient(circle at 18% 84%, rgba(217,137,0,.14), transparent 22%),
        radial-gradient(circle at 82% 80%, rgba(21,152,95,.12), transparent 18%);
    }

    .road-v,
    .road-h {
      position: absolute;
      background: var(--road);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }

    .road-v {
      left: 35%;
      width: 30%;
      top: -4%;
      height: 108%;
    }

    .road-h {
      top: 35%;
      height: 30%;
      left: -4%;
      width: 108%;
    }

    .lane-v,
    .lane-h {
      position: absolute;
      background: var(--road-line);
      opacity: .75;
    }

    .lane-v {
      top: 0;
      bottom: 0;
      width: 2px;
      left: calc(50% - 1px);
    }

    .lane-h {
      left: 0;
      right: 0;
      height: 2px;
      top: calc(50% - 1px);
    }

    .cross-box {
      position: absolute;
      left: 35%;
      top: 35%;
      width: 30%;
      height: 30%;
      border: 2px solid rgba(255,255,255,.72);
      background: rgba(20, 28, 38, .16);
    }

    .resource {
      position: absolute;
      width: 15%;
      height: 15%;
      border: 2px solid rgba(255,255,255,.55);
      display: grid;
      place-items: center;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 900;
      color: rgba(255,255,255,.86);
      transition: background .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .resource.free {
      background: rgba(21, 152, 95, .32);
    }

    .resource.busy {
      background: rgba(211, 56, 56, .54);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.16), 0 0 24px rgba(211,56,56,.28);
      transform: scale(1.015);
    }

    .resource.wait {
      background: rgba(217, 137, 0, .46);
    }

    .resource-a { left: 35%; top: 35%; }
    .resource-b { left: 50%; top: 35%; }
    .resource-c { left: 35%; top: 50%; }
    .resource-d { left: 50%; top: 50%; }

    .spawn-label {
      position: absolute;
      height: 28px;
      min-width: 70px;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      border: 1px solid var(--line);
      color: #243047;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(20, 34, 58, .12);
      font-size: 13px;
      pointer-events: none;
    }

    .spawn-ns { left: calc(35% + 3%); top: 14px; }
    .spawn-sn { left: calc(50% + 3%); bottom: 14px; }
    .spawn-we { left: 12px; top: calc(50% + 3%); }
    .spawn-ew { right: 12px; top: calc(35% + 3%); }

    .car {
      position: absolute;
      width: 42px;
      height: 26px;
      border-radius: 7px;
      border: 2px solid rgba(255,255,255,.88);
      box-shadow: 0 8px 16px rgba(0,0,0,.22);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      z-index: 8;
      transition: transform .1s linear, opacity .2s ease, filter .2s ease;
    }

    .car::before,
    .car::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 4px;
      background: rgba(255,255,255,.8);
      border-radius: 2px;
      top: 3px;
    }

    .car::before { left: 7px; }
    .car::after { right: 7px; }

    .car.waiting {
      filter: saturate(.65);
      opacity: .82;
    }

    .car.holding {
      box-shadow: 0 0 0 4px rgba(217,137,0,.24), 0 8px 16px rgba(0,0,0,.22);
    }

    .car.crossing {
      box-shadow: 0 0 0 4px rgba(21,152,95,.26), 0 8px 16px rgba(0,0,0,.22);
    }

    .car.ns,
    .car.sn {
      width: 28px;
      height: 44px;
    }

    .car.ns { background: #2563eb; }
    .car.sn { background: #16a34a; }
    .car.we { background: #d98900; }
    .car.ew { background: #7c3aed; }

    .queue-lane {
      position: absolute;
      display: flex;
      gap: 4px;
      z-index: 7;
      pointer-events: none;
    }

    .queue-ns {
      left: calc(35% + 20px);
      top: 52px;
      flex-direction: column;
    }

    .queue-sn {
      left: calc(50% + 20px);
      bottom: 52px;
      flex-direction: column-reverse;
    }

    .queue-we {
      left: 52px;
      top: calc(50% + 20px);
      flex-direction: row;
    }

    .queue-ew {
      right: 52px;
      top: calc(35% + 20px);
      flex-direction: row-reverse;
    }

    .mini-car {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 2px solid rgba(255,255,255,.86);
      box-shadow: 0 3px 7px rgba(0,0,0,.16);
    }

    .mini-car.ns { background: #2563eb; }
    .mini-car.sn { background: #16a34a; }
    .mini-car.we { background: #d98900; }
    .mini-car.ew { background: #7c3aed; }

    .event {
      position: absolute;
      left: 14px;
      bottom: 14px;
      width: min(520px, calc(100% - 28px));
      min-height: 52px;
      border-radius: 8px;
      background: rgba(255,255,255,.92);
      border: 1px solid var(--line);
      box-shadow: 0 8px 18px rgba(20,34,58,.14);
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
    }

    .event strong {
      color: var(--blue);
    }

    .resources-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .resource-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 6px;
      background: #fff;
      text-align: center;
    }

    .resource-card .r-name {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .resource-card .r-state {
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
    }

    .resource-card.busy {
      border-color: #f0b8b8;
      background: #fff6f6;
    }

    .resource-card.free {
      border-color: #bfe8d1;
      background: #f4fff8;
    }

    .queue-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
      background: #fff;
    }

    .queue-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      font-weight: 800;
      font-size: 13px;
    }

    .queue-body {
      min-height: 42px;
      padding: 8px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
    }

    .ticket {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 24px;
      border-radius: 7px;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      padding: 0 7px;
    }

    .ticket.ns { background: #2563eb; }
    .ticket.sn { background: #16a34a; }
    .ticket.we { background: #d98900; }
    .ticket.ew { background: #7c3aed; }

    .log {
      height: 172px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101827;
      color: #dfe7f5;
      padding: 9px 10px;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .log-line {
      margin-bottom: 3px;
    }

    .hint-list {
      display: grid;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .hint-list strong {
      color: var(--ink);
    }

    @media (max-width: 1180px) {
      header,
      .layout {
        grid-template-columns: 1fr;
      }

      .stage-panel {
        min-height: 640px;
      }

      .stage {
        min-height: 590px;
      }

      .top-stats {
        min-width: 0;
      }
    }

    @media (max-width: 700px) {
      .app {
        width: calc(100vw - 18px);
        padding-top: 10px;
      }

      .top-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .control-row,
      .dir-grid {
        grid-template-columns: 1fr;
      }

      .stage-head {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 520px;
      }

      .car {
        width: 34px;
        height: 22px;
      }

      .car.ns,
      .car.sn {
        width: 24px;
        height: 36px;
      }

      .spawn-label {
        font-size: 12px;
        min-width: 58px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>十字路口 PV 操作可视化小游戏</h1>
        <p class="subtitle">观察车辆如何申请 A、B、C、D 四个路口区域，比较三种无死锁解法的并发性与公平性。</p>
      </div>
      <div class="top-stats" aria-label="统计数据">
        <div class="stat"><span class="label">已通过</span><span class="value" id="passedCount">0</span></div>
        <div class="stat"><span class="label">等待中</span><span class="value" id="waitingCount">0</span></div>
        <div class="stat"><span class="label">正在通过</span><span class="value" id="crossingCount">0</span></div>
        <div class="stat"><span class="label">效率</span><span class="value" id="throughput">0/min</span></div>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel-title">三种解法</div>
        <div class="panel-body">
          <div class="mode-list">
            <button class="mode-btn active" data-mode="atomic">
              <span class="mode-name">15-1-1 一次性申请 <span class="pill green">无死锁</span></span>
              <span class="mode-text">车辆必须同时拿到两个区域；拿不全就等待，破坏“请求并保持”。</span>
            </button>
            <button class="mode-btn" data-mode="fair">
              <span class="mode-name">15-1-2 公平取号 <span class="pill blue">防饥饿</span></span>
              <span class="mode-text">车辆先取号，只有 serving 号码才能申请，体现先来先服务。</span>
            </button>
            <button class="mode-btn" data-mode="ordered">
              <span class="mode-name">15-2 统一顺序 <span class="pill amber">破环路</span></span>
              <span class="mode-text">所有车辆按 A &lt; B &lt; C &lt; D 申请资源，破坏“循环等待”。</span>
            </button>
          </div>
        </div>

        <div class="panel-title">控制台</div>
        <div class="panel-body controls">
          <div class="control-row">
            <button class="cmd primary" id="toggleAuto">开始自动发车</button>
            <button class="cmd" id="stepBtn">单步推进</button>
          </div>
          <div class="control-row">
            <button class="cmd" id="burstBtn">压力测试</button>
            <button class="cmd danger" id="resetBtn">重置</button>
          </div>
          <div class="dir-grid">
            <button class="dir" data-dir="NS">北→南</button>
            <button class="dir" data-dir="SN">南→北</button>
            <button class="dir" data-dir="WE">西→东</button>
            <button class="dir" data-dir="EW">东→西</button>
          </div>
          <div class="slider-row">
            <span>发车速度</span>
            <input id="spawnRate" type="range" min="1" max="9" value="5">
            <strong id="spawnRateLabel">5</strong>
          </div>
          <div class="slider-row">
            <span>通行速度</span>
            <input id="carSpeed" type="range" min="1" max="9" value="5">
            <strong id="carSpeedLabel">5</strong>
          </div>
        </div>
      </section>

      <section class="panel stage-panel">
        <div class="stage-head">
          <div>
            <div class="headline" id="modeTitle">15-1-1 一次性申请所有需要区域</div>
            <div class="algorithm-note" id="modeNote">检查 A/B/C/D 状态时加 mutex；两个区域都空闲才一次性占用，否则在 wait 上等待。</div>
          </div>
          <div class="status-badge" id="statusBadge">运行正常</div>
        </div>

        <div class="stage" id="stage">
          <div class="grass"></div>
          <div class="road-v"></div>
          <div class="road-h"></div>
          <div class="lane-v"></div>
          <div class="lane-h"></div>
          <div class="cross-box"></div>
          <div class="resource resource-a free" data-resource="A">A</div>
          <div class="resource resource-b free" data-resource="B">B</div>
          <div class="resource resource-c free" data-resource="C">C</div>
          <div class="resource resource-d free" data-resource="D">D</div>
          <div class="spawn-label spawn-ns">北→南</div>
          <div class="spawn-label spawn-sn">南→北</div>
          <div class="spawn-label spawn-we">西→东</div>
          <div class="spawn-label spawn-ew">东→西</div>
          <div class="queue-lane queue-ns" id="laneNS"></div>
          <div class="queue-lane queue-sn" id="laneSN"></div>
          <div class="queue-lane queue-we" id="laneWE"></div>
          <div class="queue-lane queue-ew" id="laneEW"></div>
          <div class="event" id="eventBox"><strong>目标：</strong>切换三种解法，观察车辆何时等待、何时占用资源、何时通过路口。</div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-title">资源状态</div>
        <div class="panel-body">
          <div class="resources-grid" id="resourceCards"></div>
          <div class="queue-box">
            <div class="queue-head"><span>等待队列</span><span id="queueSize">0</span></div>
            <div class="queue-body" id="queueBody"></div>
          </div>
          <div class="queue-box">
            <div class="queue-head"><span>公平取号</span><span id="ticketInfo">-</span></div>
            <div class="queue-body" id="ticketBody"></div>
          </div>
          <div class="log" id="log"></div>
        </div>
        <div class="panel-title">观察要点</div>
        <div class="panel-body">
          <div class="hint-list" id="hintList"></div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const routes = {
      NS: { name: "北→南", short: "NS", resources: ["A", "C"], color: "ns" },
      SN: { name: "南→北", short: "SN", resources: ["B", "D"], color: "sn" },
      WE: { name: "西→东", short: "WE", resources: ["C", "D"], color: "we" },
      EW: { name: "东→西", short: "EW", resources: ["A", "B"], color: "ew" }
    };

    const modeText = {
      atomic: {
        title: "15-1-1 一次性申请所有需要区域",
        note: "检查 A/B/C/D 状态时加 mutex；两个区域都空闲才一次性占用，否则在 wait 上等待。",
        hints: [
          ["一次性申请", "车辆要么同时拿到两个区域，要么一个都不拿。"],
          ["破坏请求并保持", "等待车辆不会占着 A 再等 C，因此不会形成死锁。"],
          ["广播唤醒", "车辆释放资源后唤醒等待者，大家重新检查条件。"]
        ]
      },
      fair: {
        title: "15-1-2 一次性申请 + 公平取号",
        note: "车辆到达先拿 nextTicket；只有 myTicket == serving 时才允许检查并申请区域。",
        hints: [
          ["先来先服务", "serving 号码控制申请资格，避免某个方向一直抢赢。"],
          ["仍然一次性申请", "拿不到两个区域时不占任何区域，所以不会死锁。"],
          ["队头阻塞", "当前票号车辆过不去时，后面的车也要等，公平性优先于吞吐。"]
        ]
      },
      ordered: {
        title: "15-2 按统一顺序申请资源",
        note: "每辆车都按 A < B < C < D 的顺序申请自己的两个区域，等待关系不能形成环。",
        hints: [
          ["统一顺序", "所有车辆只会从小编号资源等大编号资源。"],
          ["破坏循环等待", "不存在拿着 D 再回头等 A 的闭环。"],
          ["可能持有等待", "车辆可能先占一个区域，再等待第二个区域。"]
        ]
      }
    };

    const state = {
      mode: "atomic",
      resources: { A: null, B: null, C: null, D: null },
      cars: [],
      nextId: 1,
      passed: 0,
      auto: false,
      spawnTimer: 0,
      nextTicket: 0,
      serving: 0,
      lastTime: performance.now(),
      recentPasses: []
    };

    const stage = document.getElementById("stage");
    const resourceCards = document.getElementById("resourceCards");
    const queueBody = document.getElementById("queueBody");
    const ticketBody = document.getElementById("ticketBody");
    const logEl = document.getElementById("log");
    const eventBox = document.getElementById("eventBox");
    const statusBadge = document.getElementById("statusBadge");
    const passedCount = document.getElementById("passedCount");
    const waitingCount = document.getElementById("waitingCount");
    const crossingCount = document.getElementById("crossingCount");
    const throughput = document.getElementById("throughput");
    const queueSize = document.getElementById("queueSize");
    const ticketInfo = document.getElementById("ticketInfo");
    const spawnRate = document.getElementById("spawnRate");
    const carSpeed = document.getElementById("carSpeed");
    const spawnRateLabel = document.getElementById("spawnRateLabel");
    const carSpeedLabel = document.getElementById("carSpeedLabel");
    const toggleAuto = document.getElementById("toggleAuto");
    const modeTitle = document.getElementById("modeTitle");
    const modeNote = document.getElementById("modeNote");
    const hintList = document.getElementById("hintList");

    function addLog(text) {
      const line = document.createElement("div");
      line.className = "log-line";
      const time = new Date().toLocaleTimeString("zh-CN", { hour12: false });
      line.textContent = `[${time}] ${text}`;
      logEl.prepend(line);
      while (logEl.children.length > 70) logEl.lastChild.remove();
    }

    function setEvent(html) {
      eventBox.innerHTML = html;
    }

    function reset() {
      for (const car of state.cars) {
        if (car.el) car.el.remove();
      }
      state.resources = { A: null, B: null, C: null, D: null };
      state.cars = [];
      state.nextId = 1;
      state.passed = 0;
      state.spawnTimer = 0;
      state.nextTicket = 0;
      state.serving = 0;
      state.recentPasses = [];
      setEvent("<strong>已重置：</strong>选择方向发车，或开启自动发车。");
      addLog("重置模拟器");
      render();
    }

    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      modeTitle.textContent = modeText[mode].title;
      modeNote.textContent = modeText[mode].note;
      reset();
      addLog(`切换到 ${modeText[mode].title}`);
    }

    function createCar(dir) {
      const route = routes[dir];
      const car = {
        id: state.nextId++,
        dir,
        route,
        phase: "waiting",
        progress: 0,
        waitAge: 0,
        held: [],
        targetIndex: 0,
        ticket: state.mode === "fair" ? state.nextTicket++ : null,
        el: document.createElement("div")
      };
      car.el.className = `car ${route.color} waiting`;
      car.el.textContent = car.id;
      stage.appendChild(car.el);
      state.cars.push(car);
      addLog(`${route.name} 车辆 #${car.id} 到达，需要 ${route.resources.join("+")}${car.ticket !== null ? `，票号 ${car.ticket}` : ""}`);
      setEvent(`<strong>${route.name} #${car.id}</strong> 到达：需要申请 ${route.resources.join("、")}。`);
      tryStartCars();
      render();
    }

    function burst() {
      const pattern = ["NS", "SN", "WE", "EW", "NS", "WE", "EW", "SN"];
      pattern.forEach((dir, index) => setTimeout(() => createCar(dir), index * 90));
    }

    function canUse(resources) {
      return resources.every(r => state.resources[r] === null);
    }

    function occupy(car, resources) {
      for (const r of resources) state.resources[r] = car.id;
      car.held = [...resources];
    }

    function release(car) {
      for (const r of car.held) {
        if (state.resources[r] === car.id) state.resources[r] = null;
      }
      car.held = [];
    }

    function tryStartCars() {
      if (state.mode === "atomic") {
        for (const car of state.cars) {
          if (car.phase !== "waiting") continue;
          if (canUse(car.route.resources)) {
            occupy(car, car.route.resources);
            car.phase = "crossing";
            car.progress = 0;
            car.el.classList.remove("waiting");
            car.el.classList.add("crossing");
            addLog(`#${car.id} 一次性占用 ${car.route.resources.join("+")}，开始通过`);
          }
        }
      }

      if (state.mode === "fair") {
        const sorted = state.cars
          .filter(car => car.phase === "waiting")
          .sort((a, b) => a.ticket - b.ticket);
        for (const car of sorted) {
          if (car.ticket !== state.serving) continue;
          if (!canUse(car.route.resources)) break;
          occupy(car, car.route.resources);
          car.phase = "crossing";
          car.progress = 0;
          state.serving += 1;
          car.el.classList.remove("waiting");
          car.el.classList.add("crossing");
          addLog(`#${car.id} 票号 ${car.ticket} 获得 serving， occupies ${car.route.resources.join("+")}`);
        }
      }

      if (state.mode === "ordered") {
        for (const car of state.cars) {
          if (car.phase !== "waiting" && car.phase !== "holding") continue;
          const orderedNeed = [...car.route.resources].sort();
          while (car.targetIndex < orderedNeed.length) {
            const next = orderedNeed[car.targetIndex];
            if (state.resources[next] !== null) break;
            state.resources[next] = car.id;
            car.held.push(next);
            car.targetIndex += 1;
            car.phase = "holding";
            car.el.classList.remove("waiting");
            car.el.classList.add("holding");
            addLog(`#${car.id} 按顺序申请到 ${next}`);
          }
          if (car.targetIndex === orderedNeed.length && car.phase !== "crossing") {
            car.phase = "crossing";
            car.progress = 0;
            car.el.classList.remove("waiting", "holding");
            car.el.classList.add("crossing");
            addLog(`#${car.id} 已拿到 ${orderedNeed.join("+")}，开始通过`);
          }
        }
      }
    }

    function finishCar(car) {
      release(car);
      state.passed += 1;
      state.recentPasses.push(performance.now());
      car.phase = "done";
      car.el.style.opacity = "0";
      setTimeout(() => car.el.remove(), 220);
      addLog(`#${car.id} 通过路口并释放 ${car.route.resources.join("+")}`);
      setEvent(`<strong>#${car.id} 已通过：</strong>释放 ${car.route.resources.join("、")}，等待车辆重新竞争。`);
      state.cars = state.cars.filter(c => c !== car);
      tryStartCars();
    }

    function step(dt) {
      const speedFactor = Number(carSpeed.value);
      const crossingDelta = dt * (0.000105 + speedFactor * 0.000025);
      for (const car of [...state.cars]) {
        if (car.phase === "waiting" || car.phase === "holding") {
          car.waitAge += dt;
        }
        if (car.phase === "crossing") {
          car.progress += crossingDelta;
          if (car.progress >= 1) finishCar(car);
        }
      }

      if (state.auto) {
        const interval = 1900 - Number(spawnRate.value) * 155;
        state.spawnTimer += dt;
        while (state.spawnTimer >= interval) {
          state.spawnTimer -= interval;
          const dirs = ["NS", "SN", "WE", "EW"];
          createCar(dirs[Math.floor(Math.random() * dirs.length)]);
        }
      }

      tryStartCars();
    }

    function carPosition(car) {
      const p = car.phase === "crossing" ? car.progress : 0;
      const waitOffset = Math.min(7, car.waitAge / 800);
      if (car.dir === "NS") {
        if (car.phase === "waiting" || car.phase === "holding") return { x: 40.8, y: 8 + waitOffset, rot: 0 };
        return { x: 40.8, y: -8 + p * 116, rot: 0 };
      }
      if (car.dir === "SN") {
        if (car.phase === "waiting" || car.phase === "holding") return { x: 55.0, y: 84 - waitOffset, rot: 180 };
        return { x: 55.0, y: 108 - p * 116, rot: 180 };
      }
      if (car.dir === "WE") {
        if (car.phase === "waiting" || car.phase === "holding") return { x: 9 + waitOffset, y: 55.4, rot: 0 };
        return { x: -8 + p * 116, y: 55.4, rot: 0 };
      }
      if (car.phase === "waiting" || car.phase === "holding") return { x: 84 - waitOffset, y: 40.8, rot: 180 };
      return { x: 108 - p * 116, y: 40.8, rot: 180 };
    }

    function renderCars() {
      for (const car of state.cars) {
        const pos = carPosition(car);
        car.el.style.left = `${pos.x}%`;
        car.el.style.top = `${pos.y}%`;
        car.el.style.transform = `translate(-50%, -50%) rotate(${pos.rot}deg)`;
      }
    }

    function renderResources() {
      document.querySelectorAll(".resource").forEach(el => {
        const key = el.dataset.resource;
        const owner = state.resources[key];
        el.classList.toggle("free", owner === null);
        el.classList.toggle("busy", owner !== null);
        el.title = owner ? `${key} 被 #${owner} 占用` : `${key} 空闲`;
      });

      resourceCards.innerHTML = "";
      for (const r of ["A", "B", "C", "D"]) {
        const owner = state.resources[r];
        const card = document.createElement("div");
        card.className = `resource-card ${owner ? "busy" : "free"}`;
        card.innerHTML = `<div class="r-name">${r}</div><div class="r-state">${owner ? `#${owner} 占用` : "空闲"}</div>`;
        resourceCards.appendChild(card);
      }
    }

    function renderQueues() {
      for (const dir of ["NS", "SN", "WE", "EW"]) {
        const lane = document.getElementById(`lane${dir}`);
        lane.innerHTML = "";
        state.cars
          .filter(car => car.dir === dir && (car.phase === "waiting" || car.phase === "holding"))
          .slice(0, 7)
          .forEach(car => {
            const mini = document.createElement("div");
            mini.className = `mini-car ${routes[dir].color}`;
            mini.title = `#${car.id}`;
            lane.appendChild(mini);
          });
      }

      const waiting = state.cars.filter(car => car.phase === "waiting" || car.phase === "holding");
      queueBody.innerHTML = "";
      waiting.forEach(car => {
        const ticket = document.createElement("span");
        ticket.className = `ticket ${car.route.color}`;
        ticket.textContent = state.mode === "fair" ? `#${car.id}/${car.ticket}` : `#${car.id}`;
        ticket.title = `${car.route.name} ${car.phase === "holding" ? "已持有 " + car.held.join("+") : "等待中"}`;
        queueBody.appendChild(ticket);
      });
      queueSize.textContent = waiting.length;

      ticketBody.innerHTML = "";
      const fairCars = state.cars.filter(car => car.ticket !== null).sort((a, b) => a.ticket - b.ticket);
      fairCars.forEach(car => {
        const ticket = document.createElement("span");
        ticket.className = `ticket ${car.route.color}`;
        ticket.textContent = `T${car.ticket}`;
        ticket.title = `车辆 #${car.id}`;
        ticketBody.appendChild(ticket);
      });
      ticketInfo.textContent = state.mode === "fair" ? `next ${state.nextTicket} / serving ${state.serving}` : "仅公平模式启用";
    }

    function renderStats() {
      const waiting = state.cars.filter(car => car.phase === "waiting" || car.phase === "holding").length;
      const crossing = state.cars.filter(car => car.phase === "crossing").length;
      const now = performance.now();
      state.recentPasses = state.recentPasses.filter(t => now - t < 60000);
      passedCount.textContent = state.passed;
      waitingCount.textContent = waiting;
      crossingCount.textContent = crossing;
      throughput.textContent = `${state.recentPasses.length}/min`;

      const stuck = waiting > 0 && crossing === 0 && Object.values(state.resources).some(Boolean);
      const highWait = waiting >= 8;
      statusBadge.className = "status-badge";
      if (stuck && state.mode !== "ordered") {
        statusBadge.classList.add("warn");
        statusBadge.textContent = "等待资源";
      } else if (highWait) {
        statusBadge.classList.add("warn");
        statusBadge.textContent = "排队较长";
      } else {
        statusBadge.textContent = "运行正常";
      }
    }

    function renderHints() {
      hintList.innerHTML = "";
      for (const [title, desc] of modeText[state.mode].hints) {
        const item = document.createElement("div");
        item.innerHTML = `<strong>${title}</strong>：${desc}`;
        hintList.appendChild(item);
      }
    }

    function render() {
      renderCars();
      renderResources();
      renderQueues();
      renderStats();
      renderHints();
    }

    function tick(now) {
      const dt = Math.min(50, now - state.lastTime);
      state.lastTime = now;
      step(dt);
      render();
      requestAnimationFrame(tick);
    }

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });

    document.querySelectorAll(".dir").forEach(btn => {
      btn.addEventListener("click", () => createCar(btn.dataset.dir));
    });

    toggleAuto.addEventListener("click", () => {
      state.auto = !state.auto;
      toggleAuto.textContent = state.auto ? "暂停自动发车" : "开始自动发车";
      toggleAuto.classList.toggle("primary", !state.auto);
      setEvent(state.auto ? "<strong>自动发车已开启：</strong>观察不同算法在压力下的等待队列。" : "<strong>自动发车已暂停：</strong>可以手动发车或单步推进。");
    });

    document.getElementById("stepBtn").addEventListener("click", () => {
      step(380);
      render();
    });

    document.getElementById("burstBtn").addEventListener("click", burst);
    document.getElementById("resetBtn").addEventListener("click", reset);

    spawnRate.addEventListener("input", () => {
      spawnRateLabel.textContent = spawnRate.value;
    });
    carSpeed.addEventListener("input", () => {
      carSpeedLabel.textContent = carSpeed.value;
    });

    function seed() {
      renderResources();
      renderHints();
      addLog("小游戏已加载");
      ["NS", "SN", "WE", "EW"].forEach((dir, index) => {
        setTimeout(() => createCar(dir), index * 260);
      });
    }

    seed();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
