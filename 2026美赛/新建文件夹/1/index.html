<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球主要火箭发射基地热力分布图</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
            background-color: #f0f0f0;
        }

        .info-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            min-width: 200px;
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .legend-scale {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
        }

        .color-box {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 50%;
        }

        /* 自定义标题样式 */
        .map-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .custom-tooltip {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            font-size: 13px;
        }

        /* Remove default leaflet tooltip arrow if desired, but keep for now */
    </style>
</head>

<body>

    <div id="map"></div>

        <div style="margin-top: 10px; font-size: 12px; color: #666;">

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // 初始化地图 - 墨卡托投影是Leaflet的默认设置 (EPSG:3857)
        // 设置中心点大致在赤道附近，展示全球
        const map = L.map('map', {
            zoomSnap: 0.25,   // 缩放步频改为 0.25 (默认是 1)
            zoomDelta: 0.25   // 按钮缩放增量
        }).setView([20, 0], 2);

        // 添加底图图层 (CartoDB Positron - 简洁风格，适合展示数据)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // 数据定义
        const siteData = [
            { name: "French Guiana", coords: [5.236, -52.775], value: 146.3, country: "France/ESA", direction: 'top' },
            { name: "India", coords: [13.720, 80.230], value: 140.3, country: "India (Satish Dhawan)", direction: 'top' },
            { name: "Texas", coords: [25.997, -97.156], value: 130.5, country: "USA (Starbase)", direction: 'left' },
            { name: "Florida", coords: [28.573, -80.649], value: 129.0, country: "USA (Kennedy/Cape)", direction: 'bottom' },
            { name: "California", coords: [34.742, -120.572], value: 124.5, country: "USA (Vandenberg)", direction: 'left' },
            { name: "Virginia", coords: [37.834, -75.487], value: 122.3, country: "USA (Wallops)", direction: 'top' },
            { name: "China", coords: [38.849, 111.608], value: 120.8, country: "China (Taiyuan)", direction: 'top' },
            { name: "New Zealand", coords: [-39.261, 177.865], value: 120.8, country: "New Zealand (Mahia)", direction: 'top' },
            { name: "Kazakhstan", coords: [45.965, 63.305], value: 115.5, country: "Kazakhstan (Baikonur)", direction: 'top' },
            { name: "Alaska", coords: [57.436, -152.338], value: 107.3, country: "USA (Pacific Spaceport)", direction: 'right' }
        ];

        // 颜色插值函数
        // 数值范围: 107.3 - 146.3
        // 我们使用红色系：从淡红 (Low) 到 深红 (High)
        function getColor(value) {
            const minVal = 107.3;
            const maxVal = 146.3;

            // 归一化 0 - 1
            let ratio = (value - minVal) / (maxVal - minVal);

            // HSL 颜色模式: 红色 Hue = 0
            // Lightness (亮度): 数值越小越暗。我们将范围设为: 亮(85%) -> 暗(30%)
            // Saturation (饱和度): 设为高饱和度 90%

            const minL = 85;
            const maxL = 30; // 越深色 L值越小

            const lightness = minL - (ratio * (minL - maxL));

            return `hsl(0, 90%, ${lightness}%)`;
        }

        // 添加数据点
        siteData.forEach(site => {
            const color = getColor(site.value);

            // 创建圆形标记
            const circle = L.circleMarker(site.coords, {
                radius: 12,           // 半径
                fillColor: color,     // 填充颜色
                color: "#fff",        // 边框颜色
                weight: 2,            // 边框宽度
                opacity: 1,           // 边框透明度
                fillOpacity: 0.9      // 填充透明度
            }).addTo(map);

            // 计算offset
            let offset = [0, 0];
            const dist = 14;
            switch (site.direction) {
                case 'top': offset = [0, -dist]; break;
                case 'bottom': offset = [0, dist]; break;
                case 'left': offset = [-dist, 0]; break;
                case 'right': offset = [dist, 0]; break;
                default: offset = [0, -dist];
            }

            circle.bindTooltip(`
                <div style="text-align: center;">
                    <b>${site.name}</b><br>
                    <div style="color: ${color}; font-weight: bold;">
                        Value: ${site.value}
                    </div>
                </div>
            `, {
                permanent: true,      // 永久显示，不用点击
                direction: site.direction || 'top',
                className: 'custom-tooltip',
                offset: offset
            });

            // 也可以保留 popup 点击查看详情的功能，如果不想要可以注释掉下面这段
            circle.bindPopup(`
                <div style="text-align: center;">
                    <b>${site.name}</b>
                    <div style="font-size: 16px; color: ${color}; font-weight: bold; margin-top: 5px;">
                        Value: ${site.value}
                    </div>
                </div>
            `);
        });

        // // 生成图例
        // const legendContainer = document.getElementById('legendScale');

        // const steps = 5;

        //         <span>${val.toFixed(1)}</span>

        //     legendContainer.appendChild(item);
        // }

    </script>
</body>
